name: Daily JobSpy search

on:
  schedule:
    # 09:00 UTC = 10:00 heure de Paris (CET, hiver)
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-jobspy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOBSPY_SQLITE_PATH: data/jobspy_seen.sqlite
  JOBSPY_ALL_JSONL: data/last_scrape.jsonl
  JOBSPY_NEW_JSONL: data/new_jobs.jsonl
  JOBSPY_DISCORD_PAYLOAD: data/discord_payload.json
  JOBSPY_DISCORD_SKIP: data/discord_skipped
  JOBSPY_CACHE_KEY_PREFIX: jobspy-sqlite-${{ github.repository }}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore SQLite cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/jobspy_seen.sqlite
          key: ${{ env.JOBSPY_CACHE_KEY_PREFIX }}-${{ hashFiles('scripts/github_jobspy_sqlite.py') }}
          restore-keys: |
            ${{ env.JOBSPY_CACHE_KEY_PREFIX }}-

      - name: Install JobSpy from this repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
          python -m pip install --only-binary :all: dist/*.whl

      - name: Optional .jobspy.env from JOBSPY_DOTENV
        if: ${{ vars.JOBSPY_DOTENV != '' }}
        env:
          JOBSPY_DOTENV: ${{ vars.JOBSPY_DOTENV }}
        run: python3 scripts/github_jobspy_write_dotenv.py

      - name: Run jobspy
        env:
          FALLBACK_SEARCH_TERM: ${{ vars.JOBSPY_SEARCH_TERM }}
          FALLBACK_SITE: ${{ vars.JOBSPY_SITE }}
          FALLBACK_LOCATION: ${{ vars.JOBSPY_LOCATION }}
          FALLBACK_COUNTRY_INDEED: ${{ vars.JOBSPY_COUNTRY_INDEED }}
          FALLBACK_HOURS_OLD: ${{ vars.JOBSPY_HOURS_OLD }}
          FALLBACK_RESULTS: ${{ vars.JOBSPY_RESULTS }}
          FALLBACK_REMOTE_FLAG: ${{ vars.JOBSPY_REMOTE_FLAG }}
          FALLBACK_JOB_TYPE: ${{ vars.JOBSPY_JOB_TYPE }}
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/.jobspy.env" ]; then
            set -a
            # shellcheck disable=SC1091
            . "$GITHUB_WORKSPACE/.jobspy.env"
            set +a
          fi
          TERM="${SEARCH_TERM:-${FALLBACK_SEARCH_TERM:-software engineer}}"
          SITES="${SITE:-${FALLBACK_SITE:-indeed,linkedin,zip_recruiter,glassdoor}}"
          LOC="${LOCATION:-${FALLBACK_LOCATION:-}}"
          COUNTRY="${COUNTRY_INDEED:-${FALLBACK_COUNTRY_INDEED:-usa}}"
          HOURS="${HOURS_OLD:-${FALLBACK_HOURS_OLD:-72}}"
          N="${RESULTS:-${FALLBACK_RESULTS:-50}}"
          REMOTE_FLAG="${REMOTE_FLAG:-${FALLBACK_REMOTE_FLAG:-}}"
          JTYPE="${JOB_TYPE:-${FALLBACK_JOB_TYPE:-}}"
          mkdir -p data
          rm -f "$JOBSPY_ALL_JSONL"
          > "$JOBSPY_ALL_JSONL"
          COMMON_ARGS=( --site "$SITES" -n "$N" --hours-old "$HOURS" --country-indeed "$COUNTRY" )
          if [ -n "$LOC" ]; then COMMON_ARGS+=( --location "$LOC" ); fi
          if [ "${REMOTE_FLAG:-}" = "1" ] || [ "${REMOTE_FLAG:-}" = "true" ]; then COMMON_ARGS+=( --remote ); fi
          FIELDS_ARG="--fields id,site,title,company,location,date_posted,job_url,job_type,is_remote"

          map_job_type() {
            case "${1,,}" in
              cdi|permanent|full_time|full-time|fulltime) echo "fulltime" ;;
              cdd|interim|intérim|temporary) echo "temporary" ;;
              contract|freelance|independant|indépendant) echo "contract" ;;
              part_time|part-time|parttime) echo "parttime" ;;
              stage|alternance|internship) echo "internship" ;;
              *) echo "${1,,}" ;;
            esac
          }

          # Supporte plusieurs recherches séparées par "," ou ";" (ex: "développeur web, cybersécurité")
          TERMS_NORMALIZED="${TERM//;/,}"
          IFS=',' read -ra SEARCH_TERMS <<< "$TERMS_NORMALIZED"

          any_ok=0
          last_code=0
          run_idx=0

          for raw_term in "${SEARCH_TERMS[@]}"; do
            q_trimmed="$(echo "$raw_term" | xargs)"
            [ -z "$q_trimmed" ] && continue

            if [ -z "$JTYPE" ]; then
              run_idx=$((run_idx + 1))
              tmp_file="data/scrape_${run_idx}.jsonl"
              rm -f "$tmp_file"
              echo "Running jobspy for '$q_trimmed' ..."
              set +e
              jobspy "$q_trimmed" "${COMMON_ARGS[@]}" $FIELDS_ARG -q -o "$tmp_file" > /dev/null
              c=$?
              set -e
              if [ "$c" -eq 0 ]; then
                any_ok=1
                [ -f "$tmp_file" ] && cat "$tmp_file" >> "$JOBSPY_ALL_JSONL"
              else
                last_code=$c
              fi
            else
              IFS=',' read -ra TYPES <<< "$JTYPE"
              for raw_t in "${TYPES[@]}"; do
                t_trimmed="$(echo "$raw_t" | xargs)"
                [ -z "$t_trimmed" ] && continue
                mapped="$(map_job_type "$t_trimmed")"
                run_idx=$((run_idx + 1))
                tmp_file="data/scrape_${run_idx}_${mapped}.jsonl"
                rm -f "$tmp_file"
                echo "Running jobspy for '$q_trimmed' with --job-type $mapped ..."
                set +e
                jobspy "$q_trimmed" "${COMMON_ARGS[@]}" --job-type "$mapped" $FIELDS_ARG -q -o "$tmp_file" > /dev/null
                c=$?
                set -e
                if [ "$c" -eq 0 ]; then
                  any_ok=1
                  [ -f "$tmp_file" ] && cat "$tmp_file" >> "$JOBSPY_ALL_JSONL"
                else
                  last_code=$c
                fi
              done
            fi
          done

          if [ "$any_ok" -eq 0 ] && [ "$last_code" -ne 0 ]; then
            exit "$last_code"
          fi

      - name: Merge into SQLite (new jobs only)
        env:
          FALLBACK_JOB_TYPE: ${{ vars.JOBSPY_JOB_TYPE }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/.jobspy.env" ]; then
            set -a
            # shellcheck disable=SC1091
            . "$GITHUB_WORKSPACE/.jobspy.env"
            set +a
          fi
          export JOB_TYPE="${JOB_TYPE:-${FALLBACK_JOB_TYPE:-}}"
          python scripts/github_jobspy_sqlite.py "$JOBSPY_ALL_JSONL" "$JOBSPY_NEW_JSONL" --db "$JOBSPY_SQLITE_PATH" --job-types "$JOB_TYPE"

      - name: Build Discord payload
        env:
          FALLBACK_SKIP_DISCORD_IF_EMPTY: ${{ vars.JOBSPY_SKIP_DISCORD_IF_EMPTY }}
          FALLBACK_MAX_JOBS: ${{ vars.JOBSPY_DISCORD_MAX_JOBS }}
          FALLBACK_MAX_EMBED_CHARS: ${{ vars.JOBSPY_DISCORD_MAX_EMBED_CHARS }}
          FALLBACK_DISCORD_EMBED_TITLE: ${{ vars.JOBSPY_DISCORD_TITLE }}
          DISCORD_SKIP_MARKER: ${{ env.JOBSPY_DISCORD_SKIP }}
        run: |
          rm -f "$JOBSPY_DISCORD_SKIP" "$JOBSPY_DISCORD_PAYLOAD"
          if [ -f "$GITHUB_WORKSPACE/.jobspy.env" ]; then
            set -a
            # shellcheck disable=SC1091
            . "$GITHUB_WORKSPACE/.jobspy.env"
            set +a
          fi
          export SKIP_DISCORD_IF_EMPTY="${SKIP_DISCORD_IF_EMPTY:-${FALLBACK_SKIP_DISCORD_IF_EMPTY:-}}"
          export MAX_JOBS="${MAX_JOBS:-${FALLBACK_MAX_JOBS:-50}}"
          export MAX_EMBED_CHARS="${MAX_EMBED_CHARS:-${FALLBACK_MAX_EMBED_CHARS:-4000}}"
          export DISCORD_EMBED_TITLE="${DISCORD_EMBED_TITLE:-${FALLBACK_DISCORD_EMBED_TITLE:-}}"
          python scripts/github_discord_job_alert.py --payload-out "$JOBSPY_DISCORD_PAYLOAD" "$JOBSPY_NEW_JSONL"

      - name: Post to Discord (curl)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r')"
          URL="${URL#\"}"
          URL="${URL%\"}"
          URL="${URL#\'}"
          URL="${URL%\'}"
          if ! printf '%s' "$URL" | grep -qE '^https://(discord\.com|discordapp\.com)/api/webhooks/'; then
            echo "::error::DISCORD_WEBHOOK_URL must be the full webhook URL (https://discord.com/api/webhooks/...)"
            exit 1
          fi
          if [ -f "$JOBSPY_DISCORD_SKIP" ]; then
            echo "Discord skipped (JOBSPY_SKIP_DISCORD_IF_EMPTY and no new jobs)."
            rm -f "$JOBSPY_DISCORD_SKIP"
            exit 0
          fi
          if [ ! -f "$JOBSPY_DISCORD_PAYLOAD" ]; then
            echo "::error::Missing $JOBSPY_DISCORD_PAYLOAD — build step failed?"
            exit 1
          fi
          echo "Posting Discord payload(s) via curl (no secret in log)…"
          BATCHES_FILE="${JOBSPY_DISCORD_PAYLOAD%.json}.jsonl"
          if [ -f "$BATCHES_FILE" ]; then
            idx=0
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              idx=$((idx + 1))
              printf '%s' "$line" > /tmp/discord_batch.json
              HTTP_CODE="$(curl -sS -o /tmp/discord_resp.txt -w '%{http_code}' -X POST "$URL" \
                -H 'Content-Type: application/json' \
                -H 'User-Agent: JobSpy-GitHub-Action/1.0' \
                --data-binary @/tmp/discord_batch.json)"
              echo "Discord batch #$idx HTTP status: $HTTP_CODE"
              if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
                echo "::error::Discord rejected batch #$idx. Body:"
                head -c 2000 /tmp/discord_resp.txt || true
                exit 1
              fi
              sleep 1
            done < "$BATCHES_FILE"
          else
            HTTP_CODE="$(curl -sS -o /tmp/discord_resp.txt -w '%{http_code}' -X POST "$URL" \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: JobSpy-GitHub-Action/1.0' \
              --data-binary @"$JOBSPY_DISCORD_PAYLOAD")"
            echo "Discord HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Discord rejected the request. Body:"
              head -c 2000 /tmp/discord_resp.txt || true
              exit 1
            fi
          fi
          echo "Discord OK."

      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobspy_seen.sqlite
          key: ${{ env.JOBSPY_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
