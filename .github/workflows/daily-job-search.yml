name: Daily JobSpy search

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: daily-jobspy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOBSPY_SQLITE_PATH: data/jobspy_seen.sqlite
  JOBSPY_ALL_JSONL: data/last_scrape.jsonl
  JOBSPY_NEW_JSONL: data/new_jobs.jsonl
  JOBSPY_DISCORD_PAYLOAD: data/discord_payload.json
  JOBSPY_DISCORD_SKIP: data/discord_skipped
  JOBSPY_CACHE_KEY_PREFIX: jobspy-sqlite-${{ github.repository }}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore SQLite cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/jobspy_seen.sqlite
          key: ${{ env.JOBSPY_CACHE_KEY_PREFIX }}-${{ hashFiles('scripts/github_jobspy_sqlite.py') }}
          restore-keys: |
            ${{ env.JOBSPY_CACHE_KEY_PREFIX }}-

      - name: Install JobSpy from this repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
          python -m pip install --only-binary :all: dist/*.whl

      - name: Run jobspy
        env:
          SEARCH_TERM: ${{ vars.JOBSPY_SEARCH_TERM }}
          SITE: ${{ vars.JOBSPY_SITE }}
          LOCATION: ${{ vars.JOBSPY_LOCATION }}
          COUNTRY_INDEED: ${{ vars.JOBSPY_COUNTRY_INDEED }}
          HOURS_OLD: ${{ vars.JOBSPY_HOURS_OLD }}
          RESULTS: ${{ vars.JOBSPY_RESULTS }}
          REMOTE_FLAG: ${{ vars.JOBSPY_REMOTE_FLAG }}
        run: |
          set -euo pipefail
          TERM="${SEARCH_TERM:-software engineer}"
          SITES="${SITE:-indeed,linkedin,zip_recruiter,glassdoor}"
          LOC="${LOCATION:-}"
          COUNTRY="${COUNTRY_INDEED:-usa}"
          HOURS="${HOURS_OLD:-72}"
          N="${RESULTS:-50}"
          mkdir -p data
          ARGS=( "$TERM" --site "$SITES" -n "$N" --hours-old "$HOURS" --country-indeed "$COUNTRY" )
          if [ -n "$LOC" ]; then ARGS+=( --location "$LOC" ); fi
          if [ "${REMOTE_FLAG:-}" = "1" ] || [ "${REMOTE_FLAG:-}" = "true" ]; then ARGS+=( --remote ); fi
          ARGS+=( --fields id,site,title,company,location,date_posted,job_url,job_type,is_remote -q -o "$JOBSPY_ALL_JSONL" )
          set +e
          jobspy "${ARGS[@]}" > /dev/null
          code=$?
          set -e
          echo "jobspy exit code: $code"
          exit "$code"

      - name: Merge into SQLite (new jobs only)
        run: |
          python scripts/github_jobspy_sqlite.py "$JOBSPY_ALL_JSONL" "$JOBSPY_NEW_JSONL" --db "$JOBSPY_SQLITE_PATH"

      - name: Build Discord payload
        env:
          SKIP_DISCORD_IF_EMPTY: ${{ vars.JOBSPY_SKIP_DISCORD_IF_EMPTY }}
          MAX_JOBS: ${{ vars.JOBSPY_DISCORD_MAX_JOBS }}
          MAX_EMBED_CHARS: ${{ vars.JOBSPY_DISCORD_MAX_EMBED_CHARS }}
          DISCORD_EMBED_TITLE: ${{ vars.JOBSPY_DISCORD_TITLE }}
          DISCORD_SKIP_MARKER: ${{ env.JOBSPY_DISCORD_SKIP }}
        run: |
          rm -f "$JOBSPY_DISCORD_SKIP" "$JOBSPY_DISCORD_PAYLOAD"
          export MAX_JOBS="${MAX_JOBS:-50}"
          export MAX_EMBED_CHARS="${MAX_EMBED_CHARS:-4000}"
          python scripts/github_discord_job_alert.py --payload-out "$JOBSPY_DISCORD_PAYLOAD" "$JOBSPY_NEW_JSONL"

      - name: Post to Discord (curl)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r')"
          URL="${URL#\"}"
          URL="${URL%\"}"
          URL="${URL#\'}"
          URL="${URL%\'}"
          if ! printf '%s' "$URL" | grep -qE '^https://(discord\.com|discordapp\.com)/api/webhooks/'; then
            echo "::error::DISCORD_WEBHOOK_URL must be the full webhook URL (https://discord.com/api/webhooks/...)"
            exit 1
          fi
          if [ -f "$JOBSPY_DISCORD_SKIP" ]; then
            echo "Discord skipped (JOBSPY_SKIP_DISCORD_IF_EMPTY and no new jobs)."
            rm -f "$JOBSPY_DISCORD_SKIP"
            exit 0
          fi
          if [ ! -f "$JOBSPY_DISCORD_PAYLOAD" ]; then
            echo "::error::Missing $JOBSPY_DISCORD_PAYLOAD — build step failed?"
            exit 1
          fi
          echo "Posting Discord payload via curl (no secret in log)…"
          HTTP_CODE="$(curl -sS -o /tmp/discord_resp.txt -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: JobSpy-GitHub-Action/1.0' \
            --data-binary @"$JOBSPY_DISCORD_PAYLOAD")"
          echo "Discord HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Discord rejected the request. Body:"
            head -c 2000 /tmp/discord_resp.txt || true
            exit 1
          fi
          echo "Discord OK."

      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobspy_seen.sqlite
          key: ${{ env.JOBSPY_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
